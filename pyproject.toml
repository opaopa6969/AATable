[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "aatable"
version = "0.1.0"
description = "CJK-aware ASCII Art table converter for Markdown/CSV/TSV"
requires-python = ">=3.10"
dependencies = ["mcp==2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[tool.setuptools]
py-modules = ["aatable", "_aawidth", "aacalibrate", "aafixwidth", "mmd2ge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
